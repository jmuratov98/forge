# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception

name: Set up x
description: >-
  Registers the problem matchers, restores x's downloads and venv, runs ./x setup, and installs
  the pinned FileCheck and llvm-symbolizer (.github/ci/llvm-tools.json) from conda-forge into
  FORGE_FILECHECK and FORGE_SYMBOLIZER_PATH.
  Every run saves the caches it missed, so a pull request starts from main's caches and fills its
  own.

inputs:
  image:
    description: The runner label or container image, which keys the caches of what is built on it.
    required: true
  llvm-tools:
    description: "'false' for a job that runs no lit tests."
    default: "true"

runs:
  using: composite
  steps:
    - name: Register the problem matchers
      shell: bash
      run: |
        for matcher in gcc msvc lit; do
            echo "::add-matcher::$GITHUB_WORKSPACE/.github/ci/matchers/$matcher.json"
        done

    - name: Find Python's version
      id: python
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then python=python; else python=python3; fi
        echo "version=$("$python" -c 'import sys; print("%d.%d" % sys.version_info[:2])')" >> "$GITHUB_OUTPUT"

    - name: Restore x's downloads and venv
      id: restore-x
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .forge/cache/downloads
          .forge/venv
        key: x-${{ inputs.image }}-${{ runner.arch }}-py${{ steps.python.outputs.version }}-${{ hashFiles('utils/xtool/tools.json') }}

    - name: Install x's tools
      shell: bash
      run: ./x setup

    - name: Save x's downloads and venv
      if: steps.restore-x.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .forge/cache/downloads
          .forge/venv
        key: ${{ steps.restore-x.outputs.cache-primary-key }}

    # What is cached is the compressed packages and micromamba, not the larger installed prefix.
    - name: Restore the LLVM tools' packages
      id: restore-llvm-tools
      if: inputs.llvm-tools == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .forge/ci/conda-pkgs
        key: llvm-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/ci/llvm-tools.json', '.github/ci/llvm-tools/*.txt') }}

    - name: Install the LLVM tools
      if: inputs.llvm-tools == 'true'
      shell: bash
      run: .github/ci/install-llvm-tools.sh .forge/ci/llvm-tools

    - name: Save the LLVM tools' packages
      if: inputs.llvm-tools == 'true' && steps.restore-llvm-tools.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .forge/ci/conda-pkgs
        key: ${{ steps.restore-llvm-tools.outputs.cache-primary-key }}

    # These override the llvm-23 that the clang rows install from apt.llvm.org, which is a 23.1.5
    # snapshot, so every row runs the same tools. The value is a fixed path in the workspace, and
    # ci.yml has no trigger that runs other people's code with write access.
    - name: Use the LLVM tools
      if: inputs.llvm-tools == 'true'
      shell: bash
      run: | # zizmor: ignore[github-env]
        if [ "$RUNNER_OS" = Windows ]; then
            filecheck=Library/bin/FileCheck.exe
            symbolizer=Library/bin/llvm-symbolizer.exe
        else
            filecheck=libexec/llvm/FileCheck
            symbolizer=bin/llvm-symbolizer
        fi
        {
            echo "FORGE_FILECHECK=$GITHUB_WORKSPACE/.forge/ci/llvm-tools/$filecheck"
            echo "FORGE_SYMBOLIZER_PATH=$GITHUB_WORKSPACE/.forge/ci/llvm-tools/$symbolizer"
        } >> "$GITHUB_ENV"
