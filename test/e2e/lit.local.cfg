# Forge's own end-to-end corpus: one .c file per case, compiled with Forge.
# The corpus arrives with M1; until then this directory holds no cases.
#
# The compile command can be replaced with
#   lit --param e2e_compile_command='<command>'
# where {src}, {out} and {obj} are filled in.
import os
import sys

sys.path.insert(0, os.path.join(config.forge_source_dir, "scripts"))
import lit_e2e_format

config.suffixes = [".c"]
config.test_format = lit_e2e_format.E2EFormat(lit_e2e_format.compile_command_from(
    config, lit_config, [config.forge_exe, "-o", "{out}", "{src}"]))
